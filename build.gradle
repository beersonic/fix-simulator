plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version "$springBootVersion"
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version "$versionsPluginVersion"
    id 'com.diffplug.spotless' version "$spotlessPluginVersion"
}

group = 'org.example'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

application {
    // fully-qualified main class
    mainClass = 'com.beersonic.App'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    implementation 'org.quickfixj:quickfixj-core:2.3.2'
    implementation 'org.quickfixj:quickfixj-all:2.3.2'
    implementation 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

spotless {
    java {
        // Use the default importOrder configuration
        importOrder()
        // Use the Google Java Format
        googleJavaFormat()
        // Enforce a consistent end-of-file newline
        endWithNewline()
    }
}

// Configure the Versions plugin (check for dependency updates)
def isNonStable = { String version ->
    if (version == null) return true
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    if (stableKeywords.any { version.toUpperCase().contains(it) }) return false
    // simple semver-ish check: digits and dots (allow -r suffix)
    def regex = /^[0-9]+([.][0-9A-Za-z_-]+)*([.-]r)?$/
    return !(version ==~ regex)
}

dependencyUpdates {
    checkForGradleUpdate = true
    outputFormatter = 'json,html'
    outputDir = 'build/dependencyUpdates'
    reportfileName = 'report'
    // Reject non-stable candidate versions when current version is stable
    // Use the selection object explicitly and safe access to avoid delegate/property resolution issues
    rejectVersionIf { selection ->
        def candidateVersion = selection?.candidate?.version
        def currentVersionValue = selection?.currentVersion
        return isNonStable(candidateVersion) && !isNonStable(currentVersionValue)
    }
}


