<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Starting Backend</title>
  <style>
    body{font-family:Segoe UI,Arial;color:#222;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{width:520px;padding:24px;border-radius:8px;background:#fff;border:1px solid #eee;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .title{font-size:18px;margin-bottom:8px}
    .msg{margin-bottom:12px;color:#666}
    .spinner{width:40px;height:40px;border-radius:50%;border:4px solid #eee;border-top-color:#3b82f6;animation:spin 1s linear infinite;margin-right:12px}
    .row{display:flex;align-items:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    pre{background:#f6f8fa;padding:8px;border-radius:4px;white-space:pre-wrap;color:#111}
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="spinner" aria-hidden></div>
      <div>
        <div class="title">Starting backend...</div>
        <div id="status" class="msg">Waiting for backend to become available at the configured URL.</div>
      </div>
    </div>
    <div style="margin-top:12px">
      <div style="font-weight:600">Details</div>
      <pre id="details">If this takes too long, check the application logs or open a terminal.</pre>
    </div>
  </div>
  <script src="loading.js"></script>
</body>
</html>
